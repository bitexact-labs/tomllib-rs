[package]
name = "tomllib-rs-python"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
tomllib-rs = { path = ".." }
pyo3 = { version = "0.30", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
